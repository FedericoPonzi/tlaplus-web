name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Run tests
        working-directory: java-wrapper
        run: ./gradlew test

      - name: Build JAR
        working-directory: java-wrapper
        run: ./gradlew buildWebJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: java-wrapper/build/libs/tlaplus-web-cheerpj.jar
          generate_release_notes: true
